# Wöchentlich neue Versionen der Abhängigkeiten als Pull Request. Jeder läuft
# durch dieselbe CI wie jede andere Änderung und wird nicht automatisch gemergt.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
