# Jeder Merge nach main wird ein Release: der Windows-Installer (Bau samt
# Installations- und Update-Probe), das Docker-Abbild (Rauchtest, dann amd64
# + arm64 nach GHCR), zuletzt das GitHub-Release vX.Y.Z mit der Setup-Exe und
# ihrer Pruefsumme. Die Nummer steht nur in nebenkostenfix/abrechnung_version.py.
# Am Release haengt ausserdem das signierte update.json; daraus liest die App,
# ob es etwas Neues gibt (NK-175). Ohne Secret UPDATE_SCHLUESSEL kein Release.
# Die Tests laufen nicht noch einmal: main nimmt nur Pull Requests an, die
# aktuell und gruen sind, der gemergte Stand ist also der gepruefte. Ein
# Commit ohne gemergten Pull Request wird deshalb nicht veroeffentlicht.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  ABBILD: ghcr.io/nerbry72/nebenkostenfix

jobs:
  version:
    name: Versionsnummer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wert: ${{ steps.v.outputs.wert }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nur gemergte Pull Requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$n" = 0 ]; then
            echo "::error::$GITHUB_SHA stammt aus keinem gemergten Pull Request. Ungeprueft wird nichts veroeffentlicht."
            exit 1
          fi
      - id: v
        run: |
          v=$(python3 -c "from nebenkostenfix.abrechnung_version import SOFTWARE_VERSION as v; print(v)")
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::SOFTWARE_VERSION '$v' ist keine Nummer x.y.z"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error file=nebenkostenfix/abrechnung_version.py::v$v ist schon veroeffentlicht. SOFTWARE_VERSION anheben."
            exit 1
          fi
          echo "wert=$v" >> "$GITHUB_OUTPUT"
          echo "## NebenkostenFix $v" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      nur_paket: true

  docker:
    name: Docker-Abbild
    needs: [version, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.wert }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rauchtest (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nebenkostenfix:probe
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Abbild starten und /api/health abfragen
        run: |
          mkdir -p probe && sudo chown 1000:1000 probe
          docker run -d --name probe -p 6060:6060 -v "$PWD/probe:/data" nebenkostenfix:probe
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6060/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs probe; exit 1
      - name: Bauen und nach GHCR schieben (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ABBILD }}:${{ env.VERSION }}
            ${{ env.ABBILD }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          echo "- Docker: \`${ABBILD}:${VERSION}\` und \`:latest\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub-Release
    needs: [version, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.wert }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: nebenkostenfix-windows
          path: windows
      - name: Installer und Pruefsumme
        run: |
          exe="NebenkostenFix-${VERSION}-Setup.exe"
          cp "$(find windows -name "$exe" | head -n1)" "$exe"
          sha256sum "$exe" > SHA256SUMS.txt
          # NK-148: die Lizenztexte der mitgelieferten Software, erzeugt beim
          # Windows-Bau aus genau dieser Installation (Obermenge des Abbilds).
          lizenzen="$(find windows -name THIRD_PARTY_LICENSES.txt | head -n1)"
          if [ -z "$lizenzen" ]; then
            echo "::error::THIRD_PARTY_LICENSES.txt fehlt im Windows-Artefakt."
            exit 1
          fi
          cp "$lizenzen" THIRD_PARTY_LICENSES.txt
      # Ohne update.json saehe keine installierte App dieses Release, deshalb
      # bricht der Lauf ohne Secret ab. Der private Schluessel liegt nur dort.
      - name: Update-Manifest signieren
        env:
          UPDATE_SCHLUESSEL: ${{ secrets.UPDATE_SCHLUESSEL }}
        run: |
          if [ -z "$UPDATE_SCHLUESSEL" ]; then
            echo "::error::Secret UPDATE_SCHLUESSEL fehlt, ohne update.json kein Release."
            exit 1
          fi
          pip install --quiet cryptography==50.0.1
          umask 077
          printf '%s\n' "$UPDATE_SCHLUESSEL" > "$RUNNER_TEMP/herausgeber.pem"
          exe="NebenkostenFix-${VERSION}-Setup.exe"
          basis="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          python scripts/update_signieren.py manifest "$RUNNER_TEMP/herausgeber.pem" \
            --version "$VERSION" --installer "$exe" \
            --url "${basis}/download/v${VERSION}/${exe}" \
            --notizen "${basis}/tag/v${VERSION}" \
            --docker "${ABBILD}:${VERSION}" \
            --ausgabe update.json
          rm -f "$RUNNER_TEMP/herausgeber.pem"
          echo "- update.json: signiert" >> "$GITHUB_STEP_SUMMARY"
      - name: Release anlegen
        run: |
          exe="NebenkostenFix-${VERSION}-Setup.exe"
          dateien=("$exe" SHA256SUMS.txt THIRD_PARTY_LICENSES.txt)
          if [ -f update.json ]; then dateien+=(update.json); fi
          cat > notizen.md <<NOTIZ
          ## NebenkostenFix ${VERSION}

          **Windows:** \`${exe}\` herunterladen und ausführen (Windows 10 ab 1809, Windows 11).
          Ein bestehendes NebenkostenFix wird aktualisiert, die Daten bleiben.

          **Docker:**
          \`\`\`
          docker pull ${ABBILD}:${VERSION}
          \`\`\`
          oder in der Compose-Datei \`NK_VERSION=${VERSION}\` setzen und \`docker compose pull && docker compose up -d\`.

          **Prüfsumme (SHA256):** \`$(cut -d' ' -f1 SHA256SUMS.txt)\`
          NOTIZ
          gh release create "v${VERSION}" "${dateien[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NebenkostenFix ${VERSION}" --notes-file notizen.md --generate-notes
          echo "- Release: v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
